name: Platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.os }} / Python 3.9
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - name: Run all seven checks
        shell: bash
        run: |
          set -euo pipefail
          for check in check integration_check clients_check portability_check stdout_check guide_check verify_package; do
            python -B "tools/${check}.py"
          done
